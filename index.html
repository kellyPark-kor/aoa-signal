<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#101728">
  <link rel="manifest" href="manifest.webmanifest">
  <title>토스 스타일 실시간 시세 Signal PWA</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin:0; padding:0; background:#0e1626; color:#ffffff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    
    /* 상단 헤더 & 검색바 */
    .top-header { position:sticky; top:0; background:#0e1626; z-index:100; padding:12px 16px 8px; border-bottom:1px solid #1a2438; }
    .search-box { display:flex; align-items:center; background:#1b263b; border-radius:12px; padding:8px 12px; gap:8px; }
    .search-box input { background:none; border:none; color:#fff; font-size:15px; width:100%; outline:none; }
    .search-box input::placeholder { color:#64748b; }
    
    /* 카테고리 탭 */
    .category-tabs { display:flex; gap:16px; padding:12px 16px; overflow-x:auto; border-bottom:1px solid #1a2438; }
    .category-tabs::-webkit-scrollbar { display:none; }
    .tab-item { color:#8b9bb4; font-size:15px; font-weight:600; white-space:nowrap; cursor:pointer; padding-bottom:4px; }
    .tab-item.active { color:#38ef7d; border-bottom:2px solid #38ef7d; }

    /* 필터 칩 & 새로고침 */
    .filter-bar { display:flex; gap:10px; padding:12px 16px; align-items:center; overflow-x:auto; }
    .filter-chip { background:#1b263b; color:#94a3b8; font-size:13px; font-weight:500; padding:6px 14px; border-radius:20px; white-space:nowrap; cursor:pointer; }
    .filter-chip.active { background:#2563eb; color:#fff; font-weight:600; }
    .refresh-btn { margin-left:auto; background:#1e293b; color:#38ef7d; border:1px solid #334155; padding:5px 12px; border-radius:12px; font-size:12px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:4px; white-space:nowrap; }

    /* 종목 리스트 */
    .stock-list { padding:0 16px 80px; }
    .stock-item { display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid #162032; cursor:pointer; }
    .stock-rank { font-size:15px; font-weight:700; color:#64748b; width:28px; text-align:center; }
    .stock-info { flex:1; margin-left:8px; overflow:hidden; }
    .stock-title { font-size:15px; font-weight:600; display:flex; align-items:center; gap:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .stock-sub { font-size:12px; color:#8b9bb4; margin-top:2px; }
    
    /* 시그널 및 가격 */
    .stock-right { text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:3px; min-width:95px; }
    .price { font-size:14px; font-weight:600; }
    .change { font-size:12px; font-weight:600; }
    .up { color:#ff4d4d; }   /* 상승 빨강 */
    .down { color:#4d94ff; } /* 하락 파랑 */

    .sig-badge { padding:3px 7px; border-radius:6px; font-size:11px; font-weight:700; flex-shrink:0; }
    .sig-buy { background:rgba(56, 239, 125, 0.15); color:#38ef7d; border:1px solid rgba(56, 239, 125, 0.4); }
    .sig-sell { background:rgba(255, 77, 77, 0.15); color:#ff4d4d; border:1px solid rgba(255, 77, 77, 0.4); }
    .sig-wait { background:rgba(148, 163, 184, 0.15); color:#94a3b8; }

    /* 로딩 상태 */
    .loading-spinner { text-align:center; padding:30px; color:#64748b; font-size:14px; }

    /* 하단 네비게이션 */
    .bottom-nav { position:fixed; bottom:0; left:0; right:0; background:#0e1626; border-top:1px solid #1a2438; display:flex; justify-content:space-around; padding:8px 0; z-index:100; }
    .nav-item { flex:1; text-align:center; color:#64748b; font-size:11px; }
    .nav-item.active { color:#fff; font-weight:600; }
    .nav-icon { font-size:18px; display:block; margin-bottom:2px; }
  </style>
</head>
<body>

  <!-- 상단 검색바 -->
  <div class="top-header">
    <div class="search-box">
      <span style="color:#64748b">🔍</span>
      <input type="text" id="searchInput" placeholder="전 세계 주식/코인 검색 (예: 애플, TSLA, 005930, BTC)" oninput="handleSearchInput()">
    </div>
  </div>

  <!-- 카테고리 탭 -->
  <div class="category-tabs">
    <div class="tab-item active" onclick="setCategory('all', this)">전체인기</div>
    <div class="tab-item" onclick="setCategory('kr', this)">국내주식</div>
    <div class="tab-item" onclick="setCategory('us', this)">해외주식</div>
    <div class="tab-item" onclick="setCategory('crypto', this)">가상자산</div>
  </div>

  <!-- 필터/정렬 칩 & 실시간 갱신 버튼 -->
  <div class="filter-bar">
    <div class="filter-chip active" onclick="setFilter('all', this)">전체보기</div>
    <div class="filter-chip" onclick="setFilter('buy', this)">🟢 매수신호</div>
    <div class="filter-chip" onclick="setFilter('sell', this)">🔴 매도신호</div>
    <button class="refresh-btn" onclick="fetchRealtimeQuotes()">⚡ 실시간 갱신</button>
  </div>

  <!-- 토스 스타일 전종목 스크롤 리스트 -->
  <div class="stock-list" id="stockList"></div>

  <!-- 하단 네비게이션 바 -->
  <div class="bottom-nav">
    <div class="nav-item active"><span class="nav-icon">📈</span>실시간 차트</div>
    <div class="nav-item"><span class="nav-icon">⭐</span>관심종목</div>
    <div class="nav-item"><span class="nav-icon">🔔</span>알림 설정</div>
  </div>

<script>
// 기본 인기 모니터링 목록
const defaultPopularStocks = [
  { sym:"SOXS", name:"디렉시온 반도체 곰 3X", price:"-", change:"0.0%", isUp:true, type:"us" },
  { sym:"SOXL", name:"디렉시온 반도체 불 3X", price:"-", change:"0.0%", isUp:true, type:"us" },
  { sym:"005930.KS", name:"삼성전자", price:"-", change:"0.0%", isUp:true, type:"kr" },
  { sym:"000660.KS", name:"SK하이닉스", price:"-", change:"0.0%", isUp:true, type:"kr" },
  { sym:"TSLA", name:"테슬라", price:"-", change:"0.0%", isUp:true, type:"us" },
  { sym:"NVDA", name:"엔비디아", price:"-", change:"0.0%", isUp:true, type:"us" },
  { sym:"BTC-USD", name:"비트코인", price:"-", change:"0.0%", isUp:true, type:"crypto" },
  { sym:"ETH-USD", name:"이더리움", price:"-", change:"0.0%", isUp:true, type:"crypto" },
  { sym:"AAPL", name:"애플", price:"-", change:"0.0%", isUp:true, type:"us" },
  { sym:"035420.KS", name:"NAVER", price:"-", change:"0.0%", isUp:true, type:"kr" },
  { sym:"035720.KS", name:"카카오", price:"-", change:"0.0%", isUp:true, type:"kr" },
  { sym:"MSFT", name:"마이크로소프트", price:"-", change:"0.0%", isUp:true, type:"us" },
  { sym:"PLTR", name:"팔란티어", price:"-", change:"0.0%", isUp:true, type:"us" }
];

let currentCategory = 'all';
let currentFilter = 'all';
let searchTimeout = null;
let activeStockList = [...defaultPopularStocks];

// 기술적 지표 시뮬레이션 계산
function getSignalForStock(sym) {
  let hash = 0;
  for (let i = 0; i < sym.length; i++) hash = sym.charCodeAt(i) + ((hash << 5) - hash);
  let rsi = Math.abs(hash % 50) + 30; // 30~80
  let vr = (Math.abs(hash % 20) / 10 + 0.8).toFixed(1); // 0.8~2.8x
  
  let signal = "WAIT";
  if (rsi > 60 && vr >= 1.3) signal = "BUY";
  else if (rsi < 40 && vr >= 1.2) signal = "SELL";
  
  return { rsi, vr, signal };
}

// 야후 파이낸스 API를 통한 실시간 시세 연동 (CORS 프록시)
async function fetchRealtimeQuotes() {
  const symbols = activeStockList.map(s => s.sym).join(",");
  if (!symbols) return;

  try {
    let targetUrl = `https://query1.finance.yahoo.com/v7/finance/quote?symbols=${encodeURIComponent(symbols)}`;
    let proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;
    
    let res = await fetch(proxyUrl);
    let data = await res.json();
    
    if (data.quoteResponse && data.quoteResponse.result) {
      const results = data.quoteResponse.result;
      
      activeStockList.forEach(item => {
        let realQuote = results.find(q => q.symbol === item.sym);
        if (realQuote) {
          let priceVal = realQuote.regularMarketPrice || realQuote.price || 0;
          let changePct = realQuote.regularMarketChangePercent || 0;
          let currency = realQuote.currency || "USD";
          
          if (currency === "KRW" || item.sym.endsWith(".KS") || item.sym.endsWith(".KQ")) {
            item.price = Math.round(priceVal).toLocaleString('ko-KR') + "원";
          } else {
            item.price = "$" + priceVal.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
          }
          
          item.isUp = changePct >= 0;
          item.change = (changePct >= 0 ? "+" : "") + changePct.toFixed(2) + "%";
        }
      });
      renderList();
    }
  } catch (e) {
    console.error("Realtime Quote Error", e);
  }
}

// 검색 API
async function searchGlobalStocks(query) {
  try {
    let url = `https://query1.finance.yahoo.com/v1/finance/search?q=${encodeURIComponent(query)}&quotesCount=15`;
    let proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
    let res = await fetch(proxyUrl);
    let data = await res.json();
    
    if (data.quotes && data.quotes.length > 0) {
      return data.quotes.map(q => {
        let isKr = q.symbol.endsWith(".KS") || q.symbol.endsWith(".KQ");
        let isCrypto = q.quoteType === "CRYPTOCURRENCY" || q.symbol.includes("-USD");
        let type = isKr ? "kr" : isCrypto ? "crypto" : "us";
        return {
          sym: q.symbol,
          name: q.shortname || q.longname || q.symbol,
          price: "조회중…",
          change: "0.0%",
          isUp: true,
          type: type
        };
      });
    }
  } catch(e) {
    console.error("Search failed", e);
  }
  return [];
}

function handleSearchInput() {
  clearTimeout(searchTimeout);
  let query = document.getElementById("searchInput").value.trim();
  
  if (!query) {
    activeStockList = [...defaultPopularStocks];
    fetchRealtimeQuotes();
    return;
  }

  document.getElementById("stockList").innerHTML = '<div class="loading-spinner">⚡ 전 세계 거래소 실시간 조회 중…</div>';
  
  searchTimeout = setTimeout(async () => {
    let results = await searchGlobalStocks(query);
    if(results.length > 0) {
      activeStockList = results;
      await fetchRealtimeQuotes();
    } else {
      activeStockList = defaultPopularStocks.filter(s => 
        s.name.toLowerCase().includes(query.toLowerCase()) || 
        s.sym.toLowerCase().includes(query.toLowerCase())
      );
      renderList();
    }
  }, 400);
}

function renderList() {
  const listEl = document.getElementById("stockList");
  listEl.innerHTML = "";

  const filtered = activeStockList.filter(s => {
    const matchCat = currentCategory === 'all' || s.type === currentCategory;
    const sigInfo = getSignalForStock(s.sym);
    const matchSig = currentFilter === 'all' || 
                     (currentFilter === 'buy' && sigInfo.signal === 'BUY') ||
                     (currentFilter === 'sell' && sigInfo.signal === 'SELL');
    return matchCat && matchSig;
  });

  if(filtered.length === 0) {
    listEl.innerHTML = '<div style="text-align:center; padding:40px; color:#64748b;">조건에 맞는 종목이 없습니다.</div>';
    return;
  }

  filtered.forEach((s, idx) => {
    let sigInfo = getSignalForStock(s.sym);
    let sigText = sigInfo.signal === 'BUY' ? '🟢 매수신호' : sigInfo.signal === 'SELL' ? '🔴 매도신호' : '⚪ 관망';
    let sigClass = sigInfo.signal === 'BUY' ? 'sig-buy' : sigInfo.signal === 'SELL' ? 'sig-sell' : 'sig-wait';
    let changeClass = s.isUp ? 'up' : 'down';

    const item = document.createElement("div");
    item.className = "stock-item";
    item.innerHTML = `
      <div class="stock-rank">${idx + 1}</div>
      <div class="stock-info">
        <div class="stock-title">${s.name} <span class="sig-badge ${sigClass}">${sigText}</span></div>
        <div class="stock-sub">${s.sym} · RSI ${sigInfo.rsi} · 거래량 ${sigInfo.vr}x</div>
      </div>
      <div class="stock-right">
        <div class="price">${s.price}</div>
        <div class="change ${changeClass}">${s.change}</div>
      </div>
    `;
    listEl.appendChild(item);
  });
}

function setCategory(cat, el) {
  currentCategory = cat;
  document.querySelectorAll('.category-tabs .tab-item').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  renderList();
}

function setFilter(filt, el) {
  currentFilter = filt;
  document.querySelectorAll('.filter-bar .filter-chip').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  renderList();
}

// 최초 로드 시 실시간 시세 호출
fetchRealtimeQuotes();
</script>
</body>
</html>
