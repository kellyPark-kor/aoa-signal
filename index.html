<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#101728">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Toss 스타일 시그널 PWA</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin:0; padding:0; background:#0e1626; color:#ffffff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    
    /* 상단 헤더 & 검색바 */
    .top-header { position:sticky; top:0; background:#0e1626; z-index:100; padding:12px 16px 8px; border-bottom:1px solid #1a2438; }
    .search-box { display:flex; align-items:center; background:#1b263b; border-radius:12px; padding:8px 12px; gap:8px; }
    .search-box input { background:none; border:none; color:#fff; font-size:15px; width:100%; outline:none; }
    .search-box input::placeholder { color:#64748b; }
    
    /* 탭 메뉴 (해외주식, 국내주식, 암호화폐 등) */
    .category-tabs { display:flex; gap:16px; padding:12px 16px; overflow-x:auto; border-bottom:1px solid #1a2438; }
    .category-tabs::-webkit-scrollbar { display:none; }
    .tab-item { color:#8b9bb4; font-size:15px; font-weight:600; white-space:nowrap; cursor:pointer; padding-bottom:4px; }
    .tab-item.active { color:#38ef7d; border-bottom:2px solid #38ef7d; }

    /* 정렬 / 랭킹 필터 (거래대금, 급상승, BUY시그널 등) */
    .filter-bar { display:flex; gap:12px; padding:12px 16px; overflow-x:auto; }
    .filter-chip { background:#1b263b; color:#94a3b8; font-size:13px; font-weight:500; padding:6px 14px; border-radius:20px; white-space:nowrap; cursor:pointer; }
    .filter-chip.active { background:#2563eb; color:#fff; font-weight:600; }

    /* 종목 스크롤 리스트 (토스증권 UI 스타일) */
    .stock-list { padding:0 16px 80px; }
    .stock-item { display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid #162032; cursor:pointer; }
    .stock-rank { font-size:16px; font-weight:700; color:#64748b; width:28px; text-align:center; }
    .stock-info { flex:1; margin-left:8px; }
    .stock-title { font-size:16px; font-weight:600; display:flex; align-items:center; gap:6px; }
    .stock-sub { font-size:12px; color:#8b9bb4; margin-top:2px; }
    
    /* 시그널 및 가격 */
    .stock-right { text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:3px; }
    .price { font-size:15px; font-weight:600; }
    .change { font-size:12px; font-weight:600; }
    .up { color:#ff4d4d; }   /* 한국 스타일: 상승 빨강 */
    .down { color:#4d94ff; } /* 한국 스타일: 하락 파랑 */

    /* 시그널 배지 */
    .sig-badge { padding:3px 8px; border-radius:6px; font-size:11px; font-weight:700; letter-spacing:-0.2px; }
    .sig-buy { background:rgba(56, 239, 125, 0.15); color:#38ef7d; border:1px solid rgba(56, 239, 125, 0.4); }
    .sig-sell { background:rgba(255, 77, 77, 0.15); color:#ff4d4d; border:1px solid rgba(255, 77, 77, 0.4); }
    .sig-wait { background:rgba(148, 163, 184, 0.15); color:#94a3b8; }

    /* 하단 탭바 */
    .bottom-nav { position:fixed; bottom:0; left:0; right:0; background:#0e1626; border-top:1px solid #1a2438; display:flex; justify-shadow:space-around; padding:8px 0; z-index:100; }
    .nav-item { flex:1; text-align:center; color:#64748b; font-size:11px; }
    .nav-item.active { color:#fff; font-weight:600; }
    .nav-icon { font-size:18px; display:block; margin-bottom:2px; }
  </style>
</head>
<body>

  <!-- 상단 검색바 -->
  <div class="top-header">
    <div class="search-box">
      <span style="color:#64748b">🔍</span>
      <input type="text" id="searchInput" placeholder="종목명 또는 티커 검색 (예: 삼성전자, TSLA, BTC)" oninput="filterStocks()">
    </div>
  </div>

  <!-- 카테고리 탭 -->
  <div class="category-tabs">
    <div class="tab-item active" onclick="setCategory('all', this)">전체</div>
    <div class="tab-item" onclick="setCategory('kr', this)">국내주식</div>
    <div class="tab-item" onclick="setCategory('us', this)">해외주식</div>
    <div class="tab-item" onclick="setCategory('crypto', this)">가상자산</div>
  </div>

  <!-- 필터/정렬 칩 -->
  <div class="filter-bar">
    <div class="filter-chip active" onclick="setFilter('all', this)">전체보기</div>
    <div class="filter-chip" onclick="setFilter('buy', this)">🟢 매수 시그널만</div>
    <div class="filter-chip" onclick="setFilter('sell', this)">🔴 매도 시그널만</div>
  </div>

  <!-- 토스 스타일 종목 스크롤 리스트 -->
  <div class="stock-list" id="stockList"></div>

  <!-- 하단 네비게이션 바 -->
  <div class="bottom-nav">
    <div class="nav-item active"><span class="nav-icon">📈</span>실시간 차트</div>
    <div class="nav-item"><span class="nav-icon">⭐</span>관심종목</div>
    <div class="nav-item"><span class="nav-icon">🔔</span>알림 설정</div>
  </div>

<script>
// 사전 설정된 주요 스크롤 모니터링 종목 데이터셋
const masterStocks = [
  { rank:1, sym:"SOXS", name:"디렉시온 반도체 곰 3X", price:"46,920원", change:"+2.4%", isUp:true, type:"us", signal:"SELL", rsi:34, vr:1.8 },
  { rank:2, sym:"SOXL", name:"디렉시온 반도체 불 3X", price:"194,072원", change:"-2.4%", isUp:false, type:"us", signal:"BUY", rsi:62, vr:2.1 },
  { rank:3, sym:"005930.KS", name:"삼성전자", price:"74,500원", change:"+1.2%", isUp:true, type:"kr", signal:"BUY", rsi:58, vr:1.5 },
  { rank:4, sym:"000660.KS", name:"SK하이닉스", price:"186,200원", change:"+3.1%", isUp:true, type:"kr", signal:"BUY", rsi:68, vr:2.4 },
  { rank:5, sym:"TSLA", name:"테슬라", price:"342,150원", change:"-1.9%", isUp:false, type:"us", signal:"WAIT", rsi:49, vr:0.9 },
  { rank:6, sym:"NVDA", name:"엔비디아", price:"178,400원", change:"+4.5%", isUp:true, type:"us", signal:"BUY", rsi:71, vr:2.8 },
  { rank:7, sym:"BTC-USD", name:"비트코인", price:"128,450,000원", change:"+0.8%", isUp:true, type:"crypto", signal:"WAIT", rsi:52, vr:1.1 },
  { rank:8, sym:"ETH-USD", name:"이더리움", price:"4,820,000원", change:"-0.5%", isUp:false, type:"crypto", signal:"SELL", rsi:38, vr:1.4 },
  { rank:9, sym:"AAPL", name:"애플", price:"312,000원", change:"+0.3%", isUp:true, type:"us", signal:"WAIT", rsi:51, vr:1.0 },
  { rank:10, sym:"035420.KS", name:"NAVER", price:"215,000원", change:"-1.1%", isUp:false, type:"kr", signal:"SELL", rsi:32, vr:1.3 }
];

let currentCategory = 'all';
let currentFilter = 'all';

function renderList() {
  const query = document.getElementById("searchInput").value.toLowerCase().trim();
  const listEl = document.getElementById("stockList");
  listEl.innerHTML = "";

  const filtered = masterStocks.filter(s => {
    // 검색어 필터
    const matchQuery = s.name.toLowerCase().includes(query) || s.sym.toLowerCase().includes(query);
    // 카테고리 필터
    const matchCat = currentCategory === 'all' || s.type === currentCategory;
    // 시그널 필터
    const matchSig = currentFilter === 'all' || 
                     (currentFilter === 'buy' && s.signal === 'BUY') ||
                     (currentFilter === 'sell' && s.signal === 'SELL');
    return matchQuery && matchCat && matchSig;
  });

  if(filtered.length === 0) {
    listEl.innerHTML = '<div style="text-align:center; padding:40px; color:#64748b;">검색 결과가 없습니다.</div>';
    return;
  }

  filtered.forEach((s, idx) => {
    let sigText = s.signal === 'BUY' ? '🟢 매수신호' : s.signal === 'SELL' ? '🔴 매도신호' : '⚪ 관망';
    let sigClass = s.signal === 'BUY' ? 'sig-buy' : s.signal === 'SELL' ? 'sig-sell' : 'sig-wait';
    let changeClass = s.isUp ? 'up' : 'down';

    const item = document.createElement("div");
    item.className = "stock-item";
    item.innerHTML = `
      <div class="stock-rank">${idx + 1}</div>
      <div class="stock-info">
        <div class="stock-title">${s.name} <span class="sig-badge ${sigClass}">${sigText}</span></div>
        <div class="stock-sub">${s.sym} · RSI ${s.rsi} · 거래량 ${s.vr}x</div>
      </div>
      <div class="stock-right">
        <div class="price">${s.price}</div>
        <div class="change ${changeClass}">${s.change}</div>
      </div>
    `;
    listEl.appendChild(item);
  });
}

function filterStocks() {
  renderList();
}

function setCategory(cat, el) {
  currentCategory = cat;
  document.querySelectorAll('.category-tabs .tab-item').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  renderList();
}

function setFilter(filt, el) {
  currentFilter = filt;
  document.querySelectorAll('.filter-bar .filter-chip').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  renderList();
}

renderList();
</script>
</body>
</html>
